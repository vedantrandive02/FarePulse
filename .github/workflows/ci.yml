name: FarePulse CI

on:
  push:
    branches: ["main", "fix/vercel-production"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q main.py config.py database.py models.py providers.py schemas.py api
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
