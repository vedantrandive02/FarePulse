name: FarePulse CI

on:
  push:
    branches: ["main", "fix/vercel-production"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q main.py config.py database.py models.py providers.py schemas.py api
      - name: Smoke-test API and database routes
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from main import app

          with TestClient(app) as client:
              assert client.get('/api/health').status_code == 200
              assert client.get('/api/dashboard').status_code == 200
              assert client.get('/api/docs').status_code == 200
              params = {'origin': 'DEL', 'destination': 'BOM', 'departure_date': '2027-01-15'}
              fares = client.get('/api/fares/search', params=params)
              assert fares.status_code == 200 and len(fares.json()['fares']) > 0
              assert client.get('/api/routes/DEL/BOM/history', params={'departure_date': '2027-01-15'}).status_code == 200
              track = client.post('/api/tracks', json=params)
              assert track.status_code == 200
              assert client.get('/api/tracks').status_code == 200
              alert = client.post('/api/alerts', json={**params, 'target_price': 5000})
              assert alert.status_code == 200
              assert client.get('/api/alerts').status_code == 200
              assert client.get('/api/research/index').status_code == 200
              assert client.get('/api/research/export.csv').status_code == 200
              assert client.delete(f\"/api/alerts/{alert.json()['id']}\").status_code == 200
              assert client.delete(f\"/api/tracks/{track.json()['id']}\").status_code == 200
          PY
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
