services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: farepulse
      POSTGRES_USER: farepulse
      POSTGRES_PASSWORD: farepulse_local_password
    volumes:
      - farepulse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farepulse -d farepulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://farepulse:farepulse_local_password@db:5432/farepulse
      CORS_ORIGINS: http://localhost:5173
      FARE_PROVIDER: demo
      SCHEDULER_ENABLED: "true"
      COLLECTION_INTERVAL_MINUTES: 360
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  farepulse_pg:
